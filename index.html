<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>VHM Inventory</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div id="login-screen" class="login-screen" hidden>
  <form id="login-form" class="login-box">
    <h1>VHM Inventory</h1>
    <p class="muted">Sign in with your staff account to continue.</p>
    <label>Email
      <input id="login-email" type="email" autocomplete="username" required />
    </label>
    <label>Password
      <input id="login-password" type="password" autocomplete="current-password" required />
    </label>
    <p id="login-error" class="login-error" hidden></p>
    <button type="submit" class="btn btn-primary" id="login-submit">Sign In</button>
  </form>
</div>

<div id="app-shell" hidden>
<div class="topbar">
  <button id="btn-logout" class="btn btn-secondary" title="Sign out">Sign Out</button>
  <h1>VHM Inventory</h1>
  <button id="nav-products" class="btn btn-secondary nav-btn active">Products</button>
  <button id="nav-live" class="btn btn-secondary nav-btn">Live</button>
  <div id="products-toolbar" class="products-toolbar">
    <div class="search-wrap">
      <input id="search-input" type="text" placeholder="Search master code, POS code, name, description, tags..." />
      <button type="button" id="search-clear" class="search-clear" title="Clear search" hidden>&times;</button>
    </div>
    <button id="btn-filters" type="button" class="btn btn-secondary filters-toggle">Filters</button>
    <div id="filters-panel" class="filters-panel">
      <div class="filters-panel-header">
        <strong>Filters</strong>
        <button type="button" id="btn-filters-close" class="btn-icon" title="Close">&times;</button>
      </div>
      <select id="filter-category"></select>
      <select id="filter-tag"></select>
      <select id="filter-size"></select>
      <button type="button" id="btn-filters-apply" class="btn btn-primary filters-apply">Apply Filters</button>
    </div>
  </div>
  <div class="spacer"></div>
  <div id="products-toolbar-actions" class="products-toolbar">
    <button id="btn-backup" class="btn btn-secondary" title="Download a full backup of all data">Backup</button>
    <button id="btn-deleted" class="btn btn-secondary">Recently Deleted</button>
    <button id="btn-manage-cattags" class="btn btn-secondary">Categories & Tags</button>
    <button id="btn-new-product" class="btn btn-primary">+ New Product</button>
  </div>
  <div id="category-pills" class="category-pills"></div>
  <div id="filters-backdrop" class="filters-backdrop" hidden></div>
</div>

<main>
  <div id="products-view">
    <div class="toolbar-row">
      <span id="result-count" class="muted"></span>
    </div>
    <div id="product-grid"></div>
  </div>
  <div id="live-view" hidden></div>
</main>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
